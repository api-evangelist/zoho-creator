                    message:
                      type: string
                    tasks:
                      type: object
                      properties:
                        openurl:
                          type: object
                          properties:
                            type:
                              type: string
                            url:
                              type: string
                example: '[{"code":3000,"data":{"Phone_Number":"+15876786783","Email":"jake@zylker.com","ID":"3888833000000114023"},"message":"Data Updated Successfully!","tasks":{"openurl":{"type":"Same window","url":"http://www.zylker.com"}}},{"code":3000,"data":{"Phone_Number":"+15876786783","Email":"jake@zylker.com","ID":"3888833000000114047"},"message":"Data Updated Successfully!","tasks":{"openurl":{"type":"Same window","url":"http://www.zylker.com"}}}]'
              code:
                format: int32
                type: integer
                example: 3000
    add_records_response:
      description: '{''code'': 3950, ''message'': ''A maximum of 200 records can be added per request.''}, {''code'': 3070, ''message'': ''Data validation failure: [ARRAY]''}, {''code'': 3060, ''message'': ''Account''s record limit has been reached. Please upgrade to add more data.''}, {''code'': 4000, ''message'': ''Account''s Developer API limit has been reached. Please upgrade to execute more REST API calls.''}'
      content:
